name: Generate Snake

on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: bipplane
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - uses: actions/upload-artifact@v4
        with: { name: snake, path: dist }
      - uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: dist
          publish_branch: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
